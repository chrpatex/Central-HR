<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeNote</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeNote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/app-logo.svg">
<link rel="apple-touch-icon" href="./icons/app-apple-180.png">
<script src="./config.js"></script>
<style>
  html,body{margin:0;height:100%;background:#16304f;overflow:hidden;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f9;
    padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(135deg,#16304f,#2f6aa3);color:#fff;transition:opacity .35s;z-index:5;text-align:center;padding:24px}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  #splash h1{margin:6px 0 0;font-size:24px;letter-spacing:.01em}
  #splash p{margin:0;opacity:.75;font-size:14px}
  .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}
  .bar i{display:block;width:40%;height:100%;background:#f59a2f;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  #msg{max-width:320px;font-size:14px;line-height:1.5;opacity:.9;margin-top:6px}
  #msg button{margin-top:12px;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;background:#f59a2f;color:#fff}
  #install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:none;
    align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #install img{width:40px;height:40px;border-radius:10px}
  #install div{flex:1;font-size:13.5px;color:#1c2430;line-height:1.35}
  #install b{display:block;font-size:14.5px}
  #install .go{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;background:#1f3a5f;color:#fff}
  #install .x{border:0;background:none;font-size:20px;color:#6b7686;padding:4px 6px}
</style>
</head>
<body>
  <div id="splash">
    <img src="./icons/app-512.png" alt="">
    <h1>TimeNote</h1>
    <p>Late · Early · Visit</p>
    <div class="bar" id="bar"><i></i></div>
    <div id="msg"></div>
  </div>
  <iframe id="app" title="TimeNote" allow="clipboard-write"></iframe>

  <div id="install">
    <img src="./icons/app-192.png" alt="">
    <div id="installTxt"><b>Install TimeNote</b>Open it like an app from your home screen.</div>
    <button class="go" id="installGo">Install</button>
    <button class="x" id="installX" aria-label="Close">×</button>
  </div>

<script>
  const splash = document.getElementById('splash'), frame = document.getElementById('app');
  const msg = document.getElementById('msg'), bar = document.getElementById('bar');

  function fail(html){ bar.style.display = 'none'; msg.innerHTML = html; }

  if (!window.APP_URL || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(window.APP_URL)) {
    fail('Setup needed: open <b>config.js</b> and paste your Apps Script Web app link (ending in <b>/exec</b>).');
  } else if (!navigator.onLine) {
    fail('You are offline. Connect to the internet and try again.<br><button onclick="location.reload()">Retry</button>');
  } else {
    frame.src = window.APP_URL + '';
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('gone'), 250));
    setTimeout(() => { if (!splash.classList.contains('gone'))
      fail('Taking longer than usual…<br><button onclick="location.reload()">Retry</button>'); }, 20000);
  }
  window.addEventListener('online', () => { if (!frame.src) location.reload(); });

  // Offline support + installability
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});

  // Install banner
  const box = document.getElementById('install');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem('installDismissed') === '1'; } catch(e){}
  function closeBox(){ box.style.display = 'none'; try { localStorage.setItem('installDismissed', '1'); } catch(e){} }
  document.getElementById('installX').onclick = closeBox;
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!dismissed) box.style.display = 'flex';
  });
  document.getElementById('installGo').onclick = async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; }
    closeBox();
  };
  // iPhone/iPad: Safari has no install button, so show how to add it
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (iOS && !standalone && !dismissed) {
    document.getElementById('installTxt').innerHTML = '<b>Install TimeNote</b>Tap <b style="display:inline">Share ⬆︎</b> then <b style="display:inline">Add to Home Screen</b>.';
    document.getElementById('installGo').style.display = 'none';
    setTimeout(() => box.style.display = 'flex', 1500);
  }
</script>
</body>
</html>
